# Порты привязаны к 127.0.0.1: лаба доступна только с вашего компьютера.
services:
  vulnerable:
    build:
      context: .
      args:
        VARIANT: vulnerable
    ports:
      - "127.0.0.1:8071:5000"
  fixed:
    build:
      context: .
      args:
        VARIANT: fixed
    ports:
      - "127.0.0.1:8072:5000"
