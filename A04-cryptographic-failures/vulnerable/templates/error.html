{% extends "base.html" %}

{% block content %}

<section class="section error-section">
  <div class="container error-box">
    <p class="eyebrow">ATLAS Bank</p>
    <h1>{{ title }}</h1>

      <a class="btn" href="/">{{ t.go_home }} <span class="arr">→</span></a>

  </div>

{% endblock %}
